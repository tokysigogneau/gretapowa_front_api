<form [formGroup]="eventForm" (ngSubmit)="onSubmit()" class="event-form">
  <h2>Créer un événement</h2>

  <div class="form-group">
    <label for="name">Nom de l'événement</label>
    <input id="name" type="text" formControlName="name" placeholder="Ex: Marche pour le climat" />
  </div>

  <div class="form-row">
    <div class="form-group">
      <label for="date">Date et heure</label>
      <input id="date" type="datetime-local" formControlName="date" />
    </div>

    <div class="form-group">
      <label for="location">Lieu</label>
      <input id="location" type="text" formControlName="location" placeholder="Ex: Toulouse, France" />
    </div>
  </div>

  <div class="form-group">
    <label for="details">Détails</label>
    <textarea id="details" rows="3" formControlName="details" placeholder="Description de l'événement..."></textarea>
  </div>

  <button type="submit" [disabled]="eventForm.invalid">Ajouter l'événement</button>
</form>
